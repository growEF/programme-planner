<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2027 Interactive Programme Planner</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; background-color: #f8f9fa; color: #202124; display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar Controls */
    .sidebar { width: 320px; background: #ffffff; border-right: 1px solid #dadce0; padding: 16px; overflow-y: auto; flex-shrink: 0; }
    .sidebar h2 { font-size: 15px; margin-top: 0; margin-bottom: 12px; color: #1a73e8; }
    .cohort-card { background: #f8f9fa; border: 1px solid #dadce0; border-radius: 6px; padding: 10px; margin-bottom: 10px; }
    .cohort-card h4 { margin: 0 0 6px 0; font-size: 12px; color: #202124; display: flex; justify-content: space-between; }
    .form-group { margin-bottom: 6px; }
    .form-group label { display: block; font-size: 10px; font-weight: bold; color: #5f6368; margin-bottom: 2px; }
    .form-row { display: flex; gap: 6px; }
    input[type="date"], select, input[type="number"] { width: 100%; padding: 4px; font-size: 11px; border: 1px solid #dadce0; border-radius: 4px; }

    /* Main Dashboard Area */
    .main-content { flex: 1; padding: 20px; overflow-y: auto; }
    
    /* Top Toggles */
    .controls-card { background: #ffffff; border: 1px solid #dadce0; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .btn { padding: 6px 14px; border: 1px solid #dadce0; border-radius: 16px; background: #ffffff; cursor: pointer; font-size: 12px; font-weight: bold; color: #3c4043; transition: all 0.15s ease; }
    .btn.active { background-color: #1a73e8; color: #ffffff; border-color: #1a73e8; }
    .btn-sub { padding: 4px 10px; font-size: 11px; border-radius: 12px; }

    .section-title { font-size: 14px; font-weight: bold; color: #3c4043; margin-top: 0; margin-bottom: 12px; }

    /* Visual 1: Gantt Timeline */
    .gantt-card { background: #ffffff; border: 1px solid #dadce0; border-radius: 8px; padding: 16px; margin-bottom: 24px; overflow-x: auto; }
    .weeks-header { display: grid; grid-template-columns: 80px repeat(52, 1fr); border-bottom: 2px solid #e8eaed; padding-bottom: 6px; font-size: 10px; font-weight: bold; text-align: center; color: #5f6368; min-width: 800px; }
    .programme-row { display: grid; grid-template-columns: 80px 1fr; align-items: center; padding: 6px 0; border-bottom: 1px solid #f1f3f4; min-width: 800px; }
    .row-label { font-weight: bold; font-size: 12px; color: #3c4043; }
    
    .track-container { position: relative; height: 26px; background-color: #f1f3f4; border-radius: 4px; }
    .week-grid-lines { position: absolute; top:0; left:0; right:0; bottom:0; display: grid; grid-template-columns: repeat(52, 1fr); pointer-events: none; }
    .week-grid-lines div { border-right: 1px dashed #e8eaed; }

    .block { position: absolute; height: 18px; top: 4px; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; border-radius: 3px; z-index: 2; }
    .bg-GT { background-color: #1a73e8; }
    .bg-GE { background-color: #1e8e3e; }
    .bg-GG { background-color: #d93025; }

    /* Visual 2: Workload Charts */
    .chart-card { background: #ffffff; border: 1px solid #dadce0; border-radius: 8px; padding: 16px; margin-bottom: 24px; }
    .chart-title { font-size: 13px; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .badge { padding: 2px 8px; border-radius: 10px; font-size: 10px; color: white; font-weight: bold; }
    .badge-dave { background-color: #1a73e8; }
    .badge-jamie { background-color: #1e8e3e; }

    .chart-grid { display: grid; grid-template-columns: repeat(52, 1fr); gap: 2px; align-items: flex-end; height: 80px; border-bottom: 2px solid #dadce0; padding-bottom: 4px; min-width: 800px; }
    .bar-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative; }
    .bar { width: 100%; border-radius: 2px 2px 0 0; }
    .bar-col .tooltip { display: none; position: absolute; bottom: 105%; left: 50%; transform: translateX(-50%); background-color: #202124; color: #ffffff; padding: 4px 6px; border-radius: 4px; font-size: 9px; white-space: nowrap; z-index: 10; }
    .bar-col:hover .tooltip { display: block; }

    .load-0 { height: 2px; background-color: #e8eaed; }
    .load-1 { height: 20%; background-color: #8ab4f8; }
    .load-2 { height: 40%; background-color: #4285f4; }
    .load-3 { height: 60%; background-color: #fbbc04; }
    .load-4 { height: 80%; background-color: #ea4335; }
    .load-5 { height: 100%; background-color: #b31412; }

    /* Visual 3: Calendar Year View */
    .calendar-card { background: #ffffff; border: 1px solid #dadce0; border-radius: 8px; padding: 16px; margin-bottom: 24px; }
    .calendar-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    
    .month-card { border: 1px solid #dadce0; border-radius: 6px; background: #fafafa; padding: 10px; min-height: 120px; cursor: pointer; transition: transform 0.1s, box-shadow 0.1s; }
    .month-card:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.08); border-color: #1a73e8; }
    .month-header { font-size: 12px; font-weight: bold; color: #1a73e8; border-bottom: 1px solid #e8eaed; padding-bottom: 4px; margin-bottom: 8px; text-align: center; display: flex; justify-content: space-between; align-items: center; }
    .month-events { display: flex; flex-direction: column; gap: 4px; }
    .cal-event { font-size: 10px; padding: 4px 6px; border-radius: 4px; color: #ffffff; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .cal-event-gt { background-color: #1a73e8; }
    .cal-event-ge { background-color: #1e8e3e; }
    .cal-event-gg { background-color: #d93025; }
    .cal-event-meta { font-size: 9px; font-weight: normal; opacity: 0.95; }

    /* Drill-down Modal */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
    .modal-card { background: #ffffff; border-radius: 8px; width: 500px; max-width: 90%; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #dadce0; padding-bottom: 10px; margin-bottom: 16px; }
    .modal-header h3 { margin: 0; font-size: 16px; color: #1a73e8; }
    .close-btn { cursor: pointer; font-size: 18px; font-weight: bold; color: #5f6368; }
    .modal-body { max-height: 350px; overflow-y: auto; }
    .detail-item { background: #f8f9fa; border: 1px solid #dadce0; border-radius: 6px; padding: 10px; margin-bottom: 8px; font-size: 12px; }
    .detail-item strong { color: #202124; }
  </style>
</head>
<body>

  <!-- SIDEBAR CONTROLS -->
  <div class="sidebar">
    <h2>Cohort Settings & Roles</h2>
    <div id="sidebar-controls"></div>
  </div>

  <!-- MAIN CONTENT AREA -->
  <div class="main-content">

    <!-- MASTER TOGGLES -->
    <div class="controls-card">
      <span style="font-size: 12px; font-weight: bold;">Viewpoint:</span>
      <button class="btn active" onclick="setFilter('All', this)">All Programmes</button>
      <button class="btn" onclick="setFilter('Dave', this)">Dave's View</button>
      <button class="btn" onclick="setFilter('Jamie', this)">Jamie's View</button>
    </div>

    <!-- VISUAL 1: GANTT CHART -->
    <div class="gantt-card">
      <div class="section-title">1. Master Gantt Timeline (52 Weeks)</div>
      <div class="weeks-header" id="weeks-header">
        <div style="text-align: left;">Cohort</div>
      </div>
      <div id="gantt-rows"></div>
    </div>

    <!-- VISUAL 2: WORKLOAD CHARTS -->
    <div class="chart-card">
      <div class="section-title">2. Leader Weekly Session Workload</div>
      <div class="chart-title">Dave <span class="badge badge-dave">Weekly Sessions</span></div>
      <div class="chart-grid" id="dave-chart"></div>
      
      <div class="chart-title" style="margin-top: 16px;">Jamie <span class="badge badge-jamie">Weekly Sessions</span></div>
      <div class="chart-grid" id="jamie-chart"></div>
    </div>

    <!-- VISUAL 3: MONTHLY CALENDAR -->
    <div class="calendar-card">
      <div class="calendar-toolbar">
        <div class="section-title" style="margin-bottom:0;">3. 12-Month Calendar Overview (Click a month to zoom in)</div>
        <div>
          <button class="btn btn-sub active" onclick="setQuarter('ALL', this)">Full Year</button>
          <button class="btn btn-sub" onclick="setQuarter('Q1', this)">Q1 (Jan-Mar)</button>
          <button class="btn btn-sub" onclick="setQuarter('Q2', this)">Q2 (Apr-Jun)</button>
          <button class="btn btn-sub" onclick="setQuarter('Q3', this)">Q3 (Jul-Sep)</button>
          <button class="btn btn-sub" onclick="setQuarter('Q4', this)">Q4 (Oct-Dec)</button>
        </div>
      </div>
      <div class="calendar-grid" id="calendar-grid"></div>
    </div>

  </div>

  <!-- MONTH DRILL-DOWN MODAL -->
  <div class="modal-overlay" id="month-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-title">Month Detail</h3>
        <span class="close-btn" onclick="closeModal()">&times;</span>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script>
    let activeFilter = 'All';
    let activeQuarter = 'ALL';

    let cohorts = [
      { id: 'GT1', programme: 'GT', start: '2027-02-15', end: '2027-03-12', lead: 'Dave', leadSessions: 3, support: 'Jamie', supportSessions: 0 },
      { id: 'GT2', programme: 'GT', start: '2027-03-01', end: '2027-03-26', lead: 'Jamie', leadSessions: 3, support: 'Dave', supportSessions: 0 },
      { id: 'GT3', programme: 'GT', start: '2027-04-19', end: '2027-05-14', lead: 'Dave', leadSessions: 3, support: 'Jamie', supportSessions: 0 },
      { id: 'GT4', programme: 'GT', start: '2027-05-24', end: '2027-06-18', lead: 'Jamie', leadSessions: 3, support: 'Dave', supportSessions: 0 },
      { id: 'GT5', programme: 'GT', start: '2027-07-19', end: '2027-08-13', lead: 'Dave', leadSessions: 3, support: 'Jamie', supportSessions: 0 },
      { id: 'GT6', programme: 'GT', start: '2027-08-23', end: '2027-09-17', lead: 'Jamie', leadSessions: 3, support: 'Dave', supportSessions: 0 },
      { id: 'GE1', programme: 'GE', start: '2027-04-05', end: '2027-06-11', lead: 'Dave and Jamie', leadSessions: 1, support: 'None', supportSessions: 0 },
      { id: 'GE2', programme: 'GE', start: '2027-06-28', end: '2027-09-03', lead: 'Dave and Jamie', leadSessions: 1, support: 'None', supportSessions: 0 },
      { id: 'GE3', programme: 'GE', start: '2027-09-20', end: '2027-11-26', lead: 'Dave and Jamie', leadSessions: 1, support: 'None', supportSessions: 0 }
    ];

    const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    
    function parseDate(str) {
      if(!str) return new Date();
      const parts = str.split('-');
      return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
    }

    const yearStart = parseDate("2027-01-01").getTime();
    const yearEnd = parseDate("2027-12-31").getTime();
    const totalYearMs = yearEnd - yearStart;

    function initHeader() {
      const header = document.getElementById('weeks-header');
      header.innerHTML = '<div style="text-align: left;">Cohort</div>';
      for (let i = 1; i <= 52; i++) {
        const div = document.createElement('div');
        div.innerText = `W${i}`;
        header.appendChild(div);
      }
    }

    function renderSidebar() {
      const container = document.getElementById('sidebar-controls');
      container.innerHTML = '';

      cohorts.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'cohort-card';
        card.innerHTML = `
          <h4>${item.id} (${item.programme})</h4>
          <div class="form-group">
            <div class="form-row">
              <div><label>Start</label><input type="date" value="${item.start}" onchange="updateCohort(${index}, 'start', this.value)"></div>
              <div><label>End</label><input type="date" value="${item.end}" onchange="updateCohort(${index}, 'end', this.value)"></div>
            </div>
          </div>
          <div class="form-group">
            <div class="form-row">
              <div>
                <label>Lead</label>
                <select onchange="updateCohort(${index}, 'lead', this.value)">
                  <option value="Dave" ${item.lead === 'Dave' ? 'selected' : ''}>Dave</option>
                  <option value="Jamie" ${item.lead === 'Jamie' ? 'selected' : ''}>Jamie</option>
                  <option value="Dave and Jamie" ${item.lead === 'Dave and Jamie' ? 'selected' : ''}>Dave & Jamie</option>
                </select>
              </div>
              <div><label>Lead Sess/Wk</label><input type="number" min="0" max="5" value="${item.leadSessions}" onchange="updateCohort(${index}, 'leadSessions', parseInt(this.value))"></div>
            </div>
          </div>
          <div class="form-group">
            <div class="form-row">
              <div>
                <label>Support</label>
                <select onchange="updateCohort(${index}, 'support', this.value)">
                  <option value="None" ${item.support === 'None' ? 'selected' : ''}>None</option>
                  <option value="Dave" ${item.support === 'Dave' ? 'selected' : ''}>Dave</option>
                  <option value="Jamie" ${item.support === 'Jamie' ? 'selected' : ''}>Jamie</option>
                </select>
              </div>
              <div><label>Supp Sess/Wk</label><input type="number" min="0" max="5" value="${item.supportSessions}" onchange="updateCohort(${index}, 'supportSessions', parseInt(this.value))"></div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function updateCohort(index, key, value) {
      cohorts[index][key] = value;
      renderAll();
    }

    function setFilter(filter, btn) {
      activeFilter = filter;
      document.querySelectorAll('.controls-card .btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderAll();
    }

    function setQuarter(q, btn) {
      activeQuarter = q;
      document.querySelectorAll('.calendar-toolbar .btn-sub').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCalendar();
    }

    function getWeekNumber(dateStr) {
      const d = parseDate(dateStr);
      const start = new Date(d.getFullYear(), 0, 1);
      return Math.ceil((((d - start) / 86400000) + start.getDay() + 1) / 7);
    }

    function renderGantt() {
      const container = document.getElementById('gantt-rows');
      container.innerHTML = '';

      cohorts.forEach(item => {
        if (activeFilter !== 'All') {
          const isLead = item.lead.includes(activeFilter);
          const isSupport = item.support === activeFilter;
          if (!isLead && !isSupport) return;
        }

        const row = document.createElement('div');
        row.className = 'programme-row';

        const label = document.createElement('div');
        label.className = 'row-label';
        label.innerText = item.id;

        const track = document.createElement('div');
        track.className = 'track-container';

        const grid = document.createElement('div');
        grid.className = 'week-grid-lines';
        for (let i = 0; i < 52; i++) grid.appendChild(document.createElement('div'));
        track.appendChild(grid);

        const sTime = parseDate(item.start).getTime();
        const eTime = parseDate(item.end).getTime();

        const leftPercent = ((sTime - yearStart) / totalYearMs) * 100;
        const widthPercent = ((eTime - sTime) / totalYearMs) * 100;

        const block = document.createElement('div');
        block.className = `block bg-${item.programme}`;
        block.style.left = `${Math.max(0, leftPercent)}%`;
        block.style.width = `${Math.min(100 - leftPercent, widthPercent)}%`;
        block.innerText = item.id;

        track.appendChild(block);
        row.appendChild(label);
        row.appendChild(track);
        container.appendChild(row);
      });
    }

    function calculateWorkload(person) {
      const weeklyTotals = new Array(53).fill(0);

      cohorts.forEach(item => {
        const startW = getWeekNumber(item.start);
        const endW = getWeekNumber(item.end);

        let sessions = 0;
        if (item.lead.includes(person)) sessions += item.leadSessions;
        if (item.support === person) sessions += item.supportSessions;

        if (sessions > 0) {
          for (let w = startW; w <= endW && w <= 52; w++) {
            weeklyTotals[w] += sessions;
          }
        }
      });

      return weeklyTotals;
    }

    function renderCharts() {
      const daveData = calculateWorkload('Dave');
      const jamieData = calculateWorkload('Jamie');

      const daveContainer = document.getElementById('dave-chart');
      const jamieContainer = document.getElementById('jamie-chart');

      daveContainer.innerHTML = '';
      jamieContainer.innerHTML = '';

      for (let w = 1; w <= 52; w++) {
        const dCol = document.createElement('div');
        dCol.className = 'bar-col';
        const dCount = daveData[w];
        const dClass = dCount >= 5 ? 'load-5' : `load-${dCount}`;
        dCol.innerHTML = `<div class="bar ${dClass}"></div><div class="tooltip">W${w}: ${dCount} Sessions</div>`;
        daveContainer.appendChild(dCol);

        const jCol = document.createElement('div');
        jCol.className = 'bar-col';
        const jCount = jamieData[w];
        const jClass = jCount >= 5 ? 'load-5' : `load-${jCount}`;
        jCol.innerHTML = `<div class="bar ${jClass}"></div><div class="tooltip">W${w}: ${jCount} Sessions</div>`;
        jamieContainer.appendChild(jCol);
      }
    }

    function renderCalendar() {
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      months.forEach((monthName, monthIndex) => {
        if (activeQuarter === 'Q1' && monthIndex > 2) return;
        if (activeQuarter === 'Q2' && (monthIndex < 3 || monthIndex > 5)) return;
        if (activeQuarter === 'Q3' && (monthIndex < 6 || monthIndex > 8)) return;
        if (activeQuarter === 'Q4' && monthIndex < 9) return;

        const monthCard = document.createElement('div');
        monthCard.className = 'month-card';
        monthCard.onclick = () => openMonthModal(monthIndex);

        const header = document.createElement('div');
        header.className = 'month-header';
        header.innerHTML = `<span>${monthName}</span><span style="font-size:9px; color:#5f6368;">🔍 Zoom</span>`;
        monthCard.appendChild(header);

        const eventsContainer = document.createElement('div');
        eventsContainer.className = 'month-events';

        cohorts.forEach(item => {
          if (activeFilter !== 'All') {
            const isLead = item.lead.includes(activeFilter);
            const isSupport = item.support === activeFilter;
            if (!isLead && !isSupport) return;
          }

          const sDate = parseDate(item.start);
          const eDate = parseDate(item.end);

          if (monthIndex >= sDate.getMonth() && monthIndex <= eDate.getMonth()) {
            const ev = document.createElement('div');
            ev.className = `cal-event cal-event-${item.programme.toLowerCase()}`;
            
            let sessInfo = `${item.leadSessions}s/wk`;
            if (activeFilter !== 'All' && item.support === activeFilter) {
              sessInfo = `${item.supportSessions}s/wk (Supp)`;
            }

            ev.innerHTML = `
              <span>${item.id}</span>
              <span class="cal-event-meta">${item.lead} (${sessInfo})</span>
            `;
            eventsContainer.appendChild(ev);
          }
        });

        if (eventsContainer.children.length === 0) {
          eventsContainer.innerHTML = `<div style="font-size:10px; color:#9aa0a6; text-align:center; padding-top:10px;">No Active Programmes</div>`;
        }

        monthCard.appendChild(eventsContainer);
        grid.appendChild(monthCard);
      });
    }

    function openMonthModal(mIdx) {
      const modal = document.getElementById('month-modal');
      const title = document.getElementById('modal-title');
      const body = document.getElementById('modal-body');

      title.innerText = `${months[mIdx]} 2027 Detailed View`;
      body.innerHTML = '';

      const activeCohorts = cohorts.filter(item => {
        const sM = parseDate(item.start).getMonth();
        const eM = parseDate(item.end).getMonth();
        return mIdx >= sM && mIdx <= eM;
      });

      if (activeCohorts.length === 0) {
        body.innerHTML = `<p style="color:#5f6368; font-size:13px;">No programme cohorts active during this month.</p>`;
      } else {
        activeCohorts.forEach(item => {
          const div = document.createElement('div');
          div.className = 'detail-item';
          div.innerHTML = `
            <div style="font-weight:bold; font-size:13px; color:#1a73e8; margin-bottom:4px;">${item.id} (${item.programme})</div>
            <div><strong>Dates:</strong> ${item.start} to ${item.end}</div>
            <div><strong>Lead Instructor:</strong> ${item.lead} (${item.leadSessions} sessions/wk)</div>
            <div><strong>Support Instructor:</strong> ${item.support} (${item.supportSessions} sessions/wk)</div>
          `;
          body.appendChild(div);
        });
      }

      modal.style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('month-modal').style.display = 'none';
    }

    function renderAll() {
      renderGantt();
      renderCharts();
      renderCalendar();
    }

    initHeader();
    renderSidebar();
    renderAll();
  </script>
</body>
</html>
