<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2027 Interactive Programme Planner</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; background-color: #f8f9fa; color: #202124; display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar Layout */
    .sidebar { width: 320px; background: #ffffff; border-right: 1px solid #dadce0; padding: 16px; overflow-y: auto; flex-shrink: 0; }
    .sidebar h2 { font-size: 15px; margin-top: 0; margin-bottom: 12px; color: #1a73e8; }
    .cohort-card { background: #f8f9fa; border: 1px solid #dadce0; border-radius: 6px; padding: 10px; margin-bottom: 10px; }
    .cohort-card h4 { margin: 0 0 6px 0; font-size: 12px; color: #202124; display: flex; justify-content: space-between; }
    .form-group { margin-bottom: 6px; }
    .form-group label { display: block; font-size: 10px; font-weight: bold; color: #5f6368; margin-bottom: 2px; }
    .form-row { display: flex; gap: 6px; }
    input[type="date"], select, input[type="number"] { width: 100%; padding: 4px; font-size: 11px; border: 1px solid #dadce0; border-radius: 4px; }

    /* Main Content Layout */
    .main-content { flex: 1; padding: 20px; overflow-y: auto; }
    
    /* Viewpoint Toggles */
    .controls-card { background: #ffffff; border: 1px solid #dadce0; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .btn { padding: 6px 14px; border: 1px solid #dadce0; border-radius: 16px; background: #ffffff; cursor: pointer; font-size: 12px; font-weight: bold; color: #3c4043; transition: all 0.15s ease; }
    .btn.active { background-color: #1a73e8; color: #ffffff; border-color: #1a73e8; }

    .section-title { font-size: 14px; font-weight: bold; color: #3c4043; margin-top: 0; margin-bottom: 12px; }

    /* Visual 1: Gantt Chart */
    .gantt-card { background: #ffffff; border: 1px solid #dadce0; border-radius: 8px; padding: 16px; margin-bottom: 24px; overflow-x: auto; }
    .weeks-header { display: grid; grid-template-columns: 80px repeat(52, 1fr); border-bottom: 2px solid #e8eaed; padding-bottom: 6px; font-size: 10px; font-weight: bold; text-align: center; color: #5f6368; min-width: 800px; }
    .programme-row { display: grid; grid-template-columns: 80px 1fr; align-items: center; padding: 6px 0; border-bottom: 1px solid #f1f3f4; min-width: 800px; }
    .row-label { font-weight: bold; font-size: 12px; color: #3c4043; }
    
    .track-container { position: relative; height: 26px; background-color: #f1f3f4; border-radius: 4px; }
    .week-grid-lines { position: absolute; top:0; left:0; right:0; bottom:0; display: grid; grid-template-columns: repeat(52, 1fr); pointer-events: none; }
    .week-grid-lines div { border-right: 1px dashed #e8eaed; }

    .block { position: absolute; height: 18px; top: 4px; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; border-radius: 3px; z-index: 2; }
    .bg-GT { background-color: #1a73e8; }
    .bg-GE { background-color: #1e8e3e; }
    .bg-GG { background-color: #d93025; }

    /* Visual 2: Workload Bars */
    .chart-card { background: #ffffff; border: 1px solid #dadce0; border-radius: 8px; padding: 16px; margin-bottom: 24px; }
    .chart-title { font-size: 13px; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .badge { padding: 2px 8px; border-radius: 10px; font-size: 10px; color: white; font-weight: bold; }
    .badge-dave { background-color: #1a73e8; }
    .badge-jamie { background-color: #1e8e3e; }

    .chart-grid { display: grid; grid-template-columns: repeat(52, 1fr); gap: 2px; align-items: flex-end; height: 80px; border-bottom: 2px solid #dadce0; padding-bottom: 4px; min-width: 800px; }
    .bar-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative; }
    .bar { width: 100%; border-radius: 2px 2px 0 0; }
    .bar-col .tooltip { display: none; position: absolute; bottom: 105%; left: 50%; transform: translateX(-50%); background-color: #202124; color: #ffffff; padding: 4px 6px; border-radius: 4px; font-size: 9px; white-space: nowrap; z-index: 10; }
    .bar-col:hover .tooltip { display: block; }

    .load-0 { height: 2px; background-color: #e8eaed; }
    .load-1 { height: 20%; background-color: #8ab4f8; }
    .load-2 { height: 40%; background-color: #4285f4; }
    .load-3 { height: 60%; background-color: #fbbc04; }
    .load-4 { height: 80%; background-color: #ea4335; }
    .load-5 { height: 100%; background-color: #b31412; }

    /* Visual 3: Gapless Vertical Matrix Table */
    .matrix-card { background: #ffffff; border: 1px solid #dadce0; border-radius: 8px; padding: 16px; margin-bottom: 24px; }
    .matrix-table { width: 100%; border-collapse: collapse; font-size: 11px; table-layout: fixed; }
    .matrix-table th { background: #f1f3f4; color: #3c4043; padding: 8px; border: 1px solid #dadce0; font-weight: bold; text-align: center; position: sticky; top: 0; z-index: 5; }
    .matrix-table td { border: 1px solid #e8eaed; padding: 0; vertical-align: top; height: 28px; }
    
    .week-label-cell { width: 140px; font-weight: bold; color: #1a73e8; background: #fafafa; padding: 6px !important; }
    .empty-cell { color: #bdc1c6; font-style: italic; font-size: 10px; text-align: center; line-height: 28px; }
    
    /* Split Lane Container */
    .lane-container { display: flex; width: 100%; height: 100%; }
    .lane { flex: 1; height: 100%; padding: 0 2px; }
    
    /* Continuous Seamless Vertical Line Block */
    .v-line { width: 100%; height: 100%; color: #ffffff; font-weight: bold; font-size: 10px; padding: 2px 4px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; }
    .v-line-gt { background-color: #1a73e8; }
    .v-line-ge { background-color: #1e8e3e; }
    .v-line-gg { background-color: #d93025; }
    
    .v-start { border-top-left-radius: 5px; border-top-right-radius: 5px; }
    .v-end { border-bottom-left-radius: 5px; border-bottom-right-radius: 5px; }
    .v-meta { font-size: 9px; font-weight: normal; opacity: 0.95; }
  </style>
</head>
<body>

  <!-- SIDEBAR CONTROLS -->
  <div class="sidebar">
    <h2>Cohort Settings & Roles</h2>
    <div id="sidebar-controls"></div>
  </div>

  <!-- MAIN CONTENT AREA -->
  <div class="main-content">

    <!-- MASTER TOGGLES -->
    <div class="controls-card">
      <span style="font-size: 12px; font-weight: bold;">Viewpoint:</span>
      <button class="btn active" id="btn-all" onclick="setFilter('All', this)">All Programmes</button>
      <button class="btn" id="btn-dave" onclick="setFilter('Dave', this)">Dave's View</button>
      <button class="btn" id="btn-jamie" onclick="setFilter('Jamie', this)">Jamie's View</button>
    </div>

    <!-- VISUAL 1: GANTT CHART -->
    <div class="gantt-card">
      <div class="section-title">1. Master Gantt Timeline (52 Weeks)</div>
      <div class="weeks-header" id="weeks-header">
        <div style="text-align: left;">Cohort</div>
      </div>
      <div id="gantt-rows"></div>
    </div>

    <!-- VISUAL 2: WORKLOAD CHARTS -->
    <div class="chart-card">
      <div class="section-title">2. Leader Weekly Session Workload</div>
      <div class="chart-title">Dave <span class="badge badge-dave">Weekly Sessions</span></div>
      <div class="chart-grid" id="dave-chart"></div>
      
      <div class="chart-title" style="margin-top: 16px;">Jamie <span class="badge badge-jamie">Weekly Sessions</span></div>
      <div class="chart-grid" id="jamie-chart"></div>
    </div>

    <!-- VISUAL 3: CONTINUOUS VERTICAL MATRIX WITH SPLIT LANES -->
    <div class="matrix-card">
      <div class="section-title">3. 52-Week Vertical Programme Flow (Split Lanes & Seamless Lines)</div>
      <div style="max-height: 650px; overflow-y: auto; border: 1px solid #dadce0; border-radius: 6px;">
        <table class="matrix-table">
          <thead>
            <tr>
              <th style="width: 140px; text-align: left;">Week</th>
              <th>GT Cohorts (Split Lane 1 & 2)</th>
              <th>GE Extended Pathway</th>
              <th>GG Cohorts</th>
            </tr>
          </thead>
          <tbody id="matrix-body"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    var activeFilter = 'All';

    var cohorts = [
      { id: 'GT1', programme: 'GT', start: '2027-02-15', end: '2027-03-12', lead: 'Dave', leadSessions: 3, support: 'Jamie', supportSessions: 0 },
      { id: 'GT2', programme: 'GT', start: '2027-03-01', end: '2027-03-26', lead: 'Jamie', leadSessions: 3, support: 'Dave', supportSessions: 0 },
      { id: 'GT3', programme: 'GT', start: '2027-04-19', end: '2027-05-14', lead: 'Dave', leadSessions: 3, support: 'Jamie', supportSessions: 0 },
      { id: 'GT4', programme: 'GT', start: '2027-05-24', end: '2027-06-18', lead: 'Jamie', leadSessions: 3, support: 'Dave', supportSessions: 0 },
      { id: 'GT5', programme: 'GT', start: '2027-07-19', end: '2027-08-13', lead: 'Dave', leadSessions: 3, support: 'Jamie', supportSessions: 0 },
      { id: 'GT6', programme: 'GT', start: '2027-08-23', end: '2027-09-17', lead: 'Jamie', leadSessions: 3, support: 'Dave', supportSessions: 0 },
      { id: 'GE1', programme: 'GE', start: '2027-04-05', end: '2027-06-11', lead: 'Dave and Jamie', leadSessions: 1, support: 'None', supportSessions: 0 },
      { id: 'GE2', programme: 'GE', start: '2027-06-28', end: '2027-09-03', lead: 'Dave and Jamie', leadSessions: 1, support: 'None', supportSessions: 0 },
      { id: 'GE3', programme: 'GE', start: '2027-09-20', end: '2027-11-26', lead: 'Dave and Jamie', leadSessions: 1, support: 'None', supportSessions: 0 }
    ];

    var months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    
    function parseDate(str) {
      if(!str) return new Date();
      var parts = str.split('-');
      return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
    }

    var yearStart = parseDate("2027-01-01").getTime();
    var yearEnd = parseDate("2027-12-31").getTime();
    var totalYearMs = yearEnd - yearStart;

    function initHeader() {
      var header = document.getElementById('weeks-header');
      if(!header) return;
      header.innerHTML = '<div style="text-align: left;">Cohort</div>';
      for (var i = 1; i <= 52; i++) {
        var div = document.createElement('div');
        div.innerText = 'W' + i;
        header.appendChild(div);
      }
    }

    function renderSidebar() {
      var container = document.getElementById('sidebar-controls');
      if(!container) return;
      container.innerHTML = '';

      cohorts.forEach(function(item, index) {
        var card = document.createElement('div');
        card.className = 'cohort-card';
        
        var h4 = document.createElement('h4');
        h4.textContent = item.id + ' (' + item.programme + ')';
        card.appendChild(h4);

        var fg1 = document.createElement('div');
        fg1.className = 'form-group';
        fg1.innerHTML = '<div class="form-row">' +
          '<div><label>Start</label><input type="date" value="' + item.start + '" onchange="updateCohort(' + index + ', \'start\', this.value)"></div>' +
          '<div><label>End</label><input type="date" value="' + item.end + '" onchange="updateCohort(' + index + ', \'end\', this.value)"></div>' +
        '</div>';
        card.appendChild(fg1);

        var fg2 = document.createElement('div');
        fg2.className = 'form-group';
        fg2.innerHTML = '<div class="form-row">' +
          '<div><label>Lead</label><select id="lead-sel-' + index + '" onchange="updateCohort(' + index + ', \'lead\', this.value)"></select></div>' +
          '<div><label>Lead Sess/Wk</label><input type="number" min="0" max="5" value="' + item.leadSessions + '" onchange="updateCohort(' + index + ', \'leadSessions\', parseInt(this.value, 10))"></div>' +
        '</div>';
        card.appendChild(fg2);

        var fg3 = document.createElement('div');
        fg3.className = 'form-group';
        fg3.innerHTML = '<div class="form-row">' +
          '<div><label>Support</label><select id="supp-sel-' + index + '" onchange="updateCohort(' + index + ', \'support\', this.value)"></select></div>' +
          '<div><label>Supp Sess/Wk</label><input type="number" min="0" max="5" value="' + item.supportSessions + '" onchange="updateCohort(' + index + ', \'supportSessions\', parseInt(this.value, 10))"></div>' +
        '</div>';
        card.appendChild(fg3);

        container.appendChild(card);

        var lSel = document.getElementById('lead-sel-' + index);
        if (lSel) {
          [['Dave', 'Dave'], ['Jamie', 'Jamie'], ['Dave and Jamie', 'Dave & Jamie']].forEach(function(opt) {
            var o = document.createElement('option');
            o.value = opt[0];
            o.textContent = opt[1];
            if (item.lead === opt[0]) o.selected = true;
            lSel.appendChild(o);
          });
        }

        var sSel = document.getElementById('supp-sel-' + index);
        if (sSel) {
          [['None', 'None'], ['Dave', 'Dave'], ['Jamie', 'Jamie']].forEach(function(opt) {
            var o = document.createElement('option');
            o.value = opt[0];
            o.textContent = opt[1];
            if (item.support === opt[0]) o.selected = true;
            sSel.appendChild(o);
          });
        }
      });
    }

    function updateCohort(index, key, value) {
      cohorts[index][key] = value;
      renderAll();
    }

    function isPersonInvolved(item, person) {
      if (person === 'All') return true;
      var isLead = item.lead.indexOf(person) !== -1;
      var isSupport = item.support === person && item.supportSessions > 0;
      return isLead || isSupport;
    }

    function setFilter(filter, btn) {
      activeFilter = filter;
      var buttons = document.querySelectorAll('.controls-card .btn');
      buttons.forEach(function(b) { b.classList.remove('active'); });
      if(btn) btn.classList.add('active');
      renderAll();
    }

    function getWeekNumber(dateStr) {
      var d = parseDate(dateStr);
      var start = new Date(d.getFullYear(), 0, 1);
      return Math.ceil((((d - start) / 86400000) + start.getDay() + 1) / 7);
    }

    /* 1. GANTT RENDER */
    function renderGantt() {
      try {
        var container = document.getElementById('gantt-rows');
        if(!container) return;
        container.innerHTML = '';

        cohorts.forEach(function(item) {
          if (!isPersonInvolved(item, activeFilter)) return;

          var row = document.createElement('div');
          row.className = 'programme-row';

          var label = document.createElement('div');
          label.className = 'row-label';
          label.textContent = item.id;

          var track = document.createElement('div');
          track.className = 'track-container';

          var grid = document.createElement('div');
          grid.className = 'week-grid-lines';
          for (var i = 0; i < 52; i++) grid.appendChild(document.createElement('div'));
          track.appendChild(grid);

          var sTime = parseDate(item.start).getTime();
          var eTime = parseDate(item.end).getTime();

          var leftPercent = ((sTime - yearStart) / totalYearMs) * 100;
          var widthPercent = ((eTime - sTime) / totalYearMs) * 100;

          var block = document.createElement('div');
          block.className = 'block bg-' + item.programme;
          block.style.left = Math.max(0, leftPercent) + '%';
          block.style.width = Math.min(100 - leftPercent, widthPercent) + '%';
          block.textContent = item.id;

          track.appendChild(block);
          row.appendChild(label);
          row.appendChild(track);
          container.appendChild(row);
        });
      } catch (e) { console.error(e); }
    }

    /* 2. WORKLOAD RENDER */
    function calculateWorkload(person) {
      var weeklyTotals = [];
      for (var k = 0; k <= 52; k++) weeklyTotals.push(0);

      cohorts.forEach(function(item) {
        var startW = getWeekNumber(item.start);
        var endW = getWeekNumber(item.end);

        var sessions = 0;
        if (item.lead.indexOf(person) !== -1) sessions += item.leadSessions;
        if (item.support === person) sessions += item.supportSessions;

        if (sessions > 0) {
          for (var w = startW; w <= endW && w <= 52; w++) {
            weeklyTotals[w] += sessions;
          }
        }
      });

      return weeklyTotals;
    }

    function renderCharts() {
      try {
        var daveData = calculateWorkload('Dave');
        var jamieData = calculateWorkload('Jamie');

        var daveContainer = document.getElementById('dave-chart');
        var jamieContainer = document.getElementById('jamie-chart');

        if(!daveContainer || !jamieContainer) return;

        daveContainer.innerHTML = '';
        jamieContainer.innerHTML = '';

        for (var w = 1; w <= 52; w++) {
          var dCol = document.createElement('div');
          dCol.className = 'bar-col';
          var dCount = daveData[w];
          var dClass = dCount >= 5 ? 'load-5' : ('load-' + dCount);
          dCol.innerHTML = '<div class="bar ' + dClass + '"></div><div class="tooltip">W' + w + ': ' + dCount + ' Sessions</div>';
          daveContainer.appendChild(dCol);

          var jCol = document.createElement('div');
          jCol.className = 'bar-col';
          var jCount = jamieData[w];
          var jClass = jCount >= 5 ? 'load-5' : ('load-' + jCount);
          jCol.innerHTML = '<div class="bar ' + jClass + '"></div><div class="tooltip">W' + w + ': ' + jCount + ' Sessions</div>';
          jamieContainer.appendChild(jCol);
        }
      } catch (e) { console.error(e); }
    }

    /* 3. CONTINUOUS SEAMLESS SPLIT-LANE MATRIX RENDER */
    function renderMatrix() {
      try {
        var tbody = document.getElementById('matrix-body');
        if(!tbody) return;
        tbody.innerHTML = '';

        for (var w = 1; w <= 52; w++) {
          var weekDate = new Date(2027, 0, (w - 1) * 7 + 1);
          var monthName = months[weekDate.getMonth()];

          var tr = document.createElement('tr');

          var tdWeek = document.createElement('td');
          tdWeek.className = 'week-label-cell';
          tdWeek.innerHTML = 'Week ' + w + ' <span style="font-size:9px; color:#5f6368; font-weight:normal;">(' + weekDate.getDate() + ' ' + monthName.substring(0,3) + ')</span>';
          tr.appendChild(tdWeek);

          ['GT', 'GE', 'GG'].forEach(function(prog) {
            var td = document.createElement('td');
            
            var matching = cohorts.filter(function(item) {
              if (item.programme !== prog) return false;
              if (!isPersonInvolved(item, activeFilter)) return false;

              var sW = getWeekNumber(item.start);
              var eW = getWeekNumber(item.end);
              return w >= sW && w <= eW;
            });

            if (matching.length === 0) {
              td.innerHTML = '<div class="empty-cell">&mdash;</div>';
            } else {
              var laneContainer = document.createElement('div');
              laneContainer.className = 'lane-container';

              // Determine max lanes (GT gets 2 split lanes, GE/GG get 1)
              var maxLanes = (prog === 'GT') ? 2 : 1;
              
              for (var l = 0; l < maxLanes; l++) {
                var lane = document.createElement('div');
                lane.className = 'lane';

                var item = matching[l]; // Assign cohort to its respective lane
                if (item) {
                  var sW = getWeekNumber(item.start);
                  var eW = getWeekNumber(item.end);

                  var isStart = (w === sW);
                  var isEnd = (w === eW);

                  var sess = item.leadSessions + 's/wk';
                  if (activeFilter !== 'All' && item.support === activeFilter) {
                    sess = item.supportSessions + 's/wk (Supp)';
                  }

                  var line = document.createElement('div');
                  var cls = 'v-line v-line-' + prog.toLowerCase();
                  if (isStart) cls += ' v-start';
                  if (isEnd) cls += ' v-end';
                  line.className = cls;

                  if (isStart) {
                    line.innerHTML = '<div>' + item.id + '</div><div class="v-meta">' + item.lead + ' (' + sess + ')</div>';
                  }

                  lane.appendChild(line);
                }

                laneContainer.appendChild(lane);
              }

              td.appendChild(laneContainer);
            }

            tr.appendChild(td);
          });

          tbody.appendChild(tr);
        }
      } catch (e) { console.error(e); }
    }

    function renderAll() {
      renderGantt();
      renderCharts();
      renderMatrix();
    }

    window.onload = function() {
      initHeader();
      renderSidebar();
      renderAll();
    };
  </script>
</body>
</html>
