<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2027 Interactive Programme Planner</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; background-color: #f8f9fa; color: #202124; display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar Layout */
    .sidebar { width: 320px; background: #ffffff; border-right: 1px solid #dadce0; padding: 16px; overflow-y: auto; flex-shrink: 0; }
    .sidebar h2 { font-size: 15px; margin-top: 0; margin-bottom: 12px; color: #1a73e8; }
    .cohort-card { background: #f8f9fa; border: 1px solid #dadce0; border-radius: 6px; padding: 10px; margin-bottom: 10px; }
    .cohort-card h4 { margin: 0 0 6px 0; font-size: 12px; color: #202124; display: flex; justify-content: space-between; }
    .form-group { margin-bottom: 6px; }
    .form-group label { display: block; font-size: 10px; font-weight: bold; color: #5f6368; margin-bottom: 2px; }
    .form-row { display: flex; gap: 6px; }
    input[type="date"], select, input[type="number"] { width: 100%; padding: 4px; font-size: 11px; border: 1px solid #dadce0; border-radius: 4px; }

    /* Main Content Layout */
    .main-content { flex: 1; padding: 20px; overflow-y: auto; }
    
    /* Viewpoint Toggles */
    .controls-card { background: #ffffff; border: 1px solid #dadce0; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .btn { padding: 6px 14px; border: 1px solid #dadce0; border-radius: 16px; background: #ffffff; cursor: pointer; font-size: 12px; font-weight: bold; color: #3c4043; transition: all 0.15s ease; }
    .btn.active { background-color: #1a73e8; color: #ffffff; border-color: #1a73e8; }

    .section-title { font-size: 14px; font-weight: bold; color: #3c4043; margin-top: 0; margin-bottom: 12px; }

    /* Visual 1: Gantt Chart */
    .gantt-card { background: #ffffff; border: 1px solid #dadce0; border-radius: 8px; padding: 16px; margin-bottom: 24px; overflow-x: auto; }
    .weeks-header { display: grid; grid-template-columns: 80px repeat(52, 1fr); border-bottom: 2px solid #e8eaed; padding-bottom: 6px; font-size: 10px; font-weight: bold; text-align: center; color: #5f6368; min-width: 800px; }
    .programme-row { display: grid; grid-template-columns: 80px 1fr; align-items: center; padding: 6px 0; border-bottom: 1px solid #f1f3f4; min-width: 800px; }
    .row-label { font-weight: bold; font-size: 12px; color: #3c4043; }
    
    .track-container { position: relative; height: 26px; background-color: #f1f3f4; border-radius: 4px; }
    .week-grid-lines { position: absolute; top:0; left:0; right:0; bottom:0; display: grid; grid-template-columns: repeat(52, 1fr); pointer-events: none; }
    .week-grid-lines div { border-right: 1px dashed #e8eaed; }

    .block { position: absolute; height: 18px; top: 4px; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; border-radius: 3px; z-index: 2; transition: all 0.2s; }
    .bg-GT { background-color: #1a73e8; }
    .bg-GE { background-color: #1e8e3e; }
    .bg-GG { background-color: #d93025; }

    /* Visual 2: Workload Bars */
    .chart-card { background: #ffffff; border: 1px solid #dadce0; border-radius: 8px; padding: 16px; margin-bottom: 24px; }
    .chart-title { font-size: 13px; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .badge { padding: 2px 8px; border-radius: 10px; font-size: 10px; color: white; font-weight: bold; }
    .badge-dave { background-color: #1a73e8; }
    .badge-jamie { background-color: #1e8e3e; }

    .chart-grid { display: grid; grid-template-columns: repeat(52, 1fr); gap: 2px; align-items: flex-end; height: 80px; border-bottom: 2px solid #dadce0; padding-bottom: 4px; min-width: 800px; }
    .bar-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative; }
    .bar { width: 100%; border-radius: 2px 2px 0 0; }
    .bar-col .tooltip { display: none; position: absolute; bottom: 105%; left: 50%; transform: translateX(-50%); background-color: #202124; color: #ffffff; padding: 4px 6px; border-radius: 4px; font-size: 9px; white-space: nowrap; z-index: 10; }
    .bar-col:hover .tooltip { display: block; }

    .load-0 { height: 2px; background-color: #e8eaed; }
    .load-1 { height: 20%; background-color: #8ab4f8; }
    .load-2 { height: 40%; background-color: #4285f4; }
    .load-3 { height: 60%; background-color: #fbbc04; }
    .load-4 { height: 80%; background-color: #ea4335; }
    .load-5 { height: 100%; background-color: #b31412; }

    /* Visual 3: Continuous Vertical Matrix Table */
    .matrix-card { background: #ffffff; border: 1px solid #dadce0; border-radius: 8px; padding: 16px; margin-bottom: 24px; }
    .matrix-table { width: 100%; border-collapse: collapse; font-size: 11px; table-layout: fixed; }
    .matrix-table th { background: #f1f3f4; color: #3c4043; padding: 8px; border: 1px solid #dadce0; font-weight: bold; text-align: center; position: sticky; top: 0; z-index: 5; }
    .matrix-table td { border: 1px solid #e8eaed; padding: 0; vertical-align: top; height: 28px; }

    /* Matrix Column Widths */
    .col-week { width: 140px; }
    .col-gt   { width: 36%; }
    .col-ge   { width: 18%; }
    .col-gg   { width: 36%; }

    .week-label-cell { width: 140px; font-weight: bold; color: #1a73e8; background: #fafafa; padding: 6px !important; }
    .empty-cell { color: #bdc1c6; font-style: italic; font-size: 10px; text-align: center; line-height: 28px; }

    .lane-container { display: flex; width: 100%; height: 100%; }
    .lane { flex: 1; height: 100%; padding: 0 2px; }

    .v-line { width: 100%; height: 100%; color: #ffffff; font-weight: bold; font-size: 10px; padding: 2px 4px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; }
    .v-line-gt { background-color: #1a73e8; }
    .v-line-ge { background-color: #1e8e3e; }
    .v-line-gg { background-color: #d93025; }

    .v-start { border-top-left-radius: 5px; border-top-right-radius: 5px; }
    .v-end { border-bottom-left-radius: 5px; border-bottom-right-radius: 5px; }
    .v-meta { font-size: 9px; font-weight: normal; opacity: 0.95; }
  </style>
</head>
<body>

  <!-- SIDEBAR CONTROLS -->
  <div class="sidebar">
    <h2>Cohort Settings & Roles</h2>
    <div id="sidebar-controls"></div>
  </div>

  <!-- MAIN CONTENT AREA -->
  <div class="main-content">

    <!-- MASTER TOGGLES -->
    <div class="controls-card">
      <span style="font-size: 12px; font-weight: bold;">Viewpoint:</span>
      <button class="btn active" id="btn-all">All Programmes</button>
      <button class="btn" id="btn-dave">Dave's View</button>
      <button class="btn" id="btn-jamie">Jamie's View</button>
    </div>

    <!-- VISUAL 1: GANTT CHART -->
    <div class="gantt-card">
      <div class="section-title">1. Master Gantt Timeline (52 Weeks)</div>
      <div class="weeks-header" id="weeks-header">
        <div style="text-align: left;">Cohort</div>
      </div>
      <div id="gantt-rows"></div>
    </div>

    <!-- VISUAL 2: WORKLOAD CHARTS -->
    <div class="chart-card">
      <div class="section-title">2. Leader Weekly Session Workload</div>
      <div class="chart-title">Dave <span class="badge badge-dave">Weekly Sessions</span></div>
      <div class="chart-grid" id="dave-chart"></div>
      
      <div class="chart-title" style="margin-top: 16px;">Jamie <span class="badge badge-jamie">Weekly Sessions</span></div>
      <div class="chart-grid" id="jamie-chart"></div>
    </div>

    <!-- VISUAL 3: CONTINUOUS VERTICAL MATRIX WITH FIXED SPLIT LANES -->
    <div class="matrix-card">
      <div class="section-title">3. 52-Week Vertical Programme Flow (Split Lanes & Seamless Lines)</div>
      <div style="max-height: 650px; overflow-y: auto; border: 1px solid #dadce0; border-radius: 6px;">
        <table class="matrix-table">
          <colgroup>
            <col class="col-week">
            <col class="col-gt">
            <col class="col-ge">
            <col class="col-gg">
          </colgroup>
          <thead>
            <tr>
              <th style="text-align: left;">Week</th>
              <th>GT Cohorts (Lane 1 & 2)</th>
              <th>GE Extended Pathway</th>
              <th>GG Cohorts (Lane 1 & 2)</th>
            </tr>
          </thead>
          <tbody id="matrix-body"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    let activeFilter = 'All';

    // Default cohorts updated to match currently entered dates and roles
    const cohorts = [
      { id: 'GT1', name: 'GT1', prog: 'GT', startDate: '2027-02-15', endDate: '2027-03-05', leader: 'Dave', leadSess: 3, support: 'Jamie', suppSess: 0 },
      { id: 'GT2', name: 'GT2', prog: 'GT', startDate: '2027-03-01', endDate: '2027-03-19', leader: 'Jamie', leadSess: 3, support: 'Dave', suppSess: 0 },
      { id: 'GT3', name: 'GT3', prog: 'GT', startDate: '2027-04-19', endDate: '2027-05-14', leader: 'Dave', leadSess: 3, support: 'Jamie', suppSess: 2 },
      { id: 'GT4', name: 'GT4', prog: 'GT', startDate: '2027-05-24', endDate: '2027-06-18', leader: 'Jamie', leadSess: 3, support: 'Dave', suppSess: 2 },
      { id: 'GT5', name: 'GT5', prog: 'GT', startDate: '2027-07-19', endDate: '2027-08-13', leader: 'Dave', leadSess: 3, support: 'Jamie', suppSess: 0 },
      { id: 'GT6', name: 'GT6', prog: 'GT', startDate: '2027-08-23', endDate: '2027-09-17', leader: 'Jamie', leadSess: 3, support: 'Dave', suppSess: 2 },
      { id: 'GE1', name: 'GE1', prog: 'GE', startDate: '2027-04-05', endDate: '2027-06-11', leader: 'Dave & Jamie', leadSess: 1, support: 'None', suppSess: 0 },
      { id: 'GE2', name: 'GE2', prog: 'GE', startDate: '2027-06-28', endDate: '2027-09-03', leader: 'Dave & Jamie', leadSess: 1, support: 'None', suppSess: 0 },
      { id: 'GE3', name: 'GE3', prog: 'GE', startDate: '2027-09-20', endDate: '2027-11-26', leader: 'Dave & Jamie', leadSess: 1, support: 'None', suppSess: 0 },
      { id: 'GG1', name: 'GG1', prog: 'GG', startDate: '2027-07-05', endDate: '2027-08-09', leader: 'Jamie', leadSess: 2, support: 'Jamie', suppSess: 0 },
      { id: 'GG2', name: 'GG2', prog: 'GG', startDate: '2027-10-04', endDate: '2027-11-09', leader: 'Dave', leadSess: 2, support: 'Dave', suppSess: 0 },
      { id: 'GG3', name: 'GG3', prog: 'GG', startDate: '2027-10-18', endDate: '2027-11-22', leader: 'Jamie', leadSess: 2, support: 'None', suppSess: 0 }
    ];

    // Helper functions for date & week calculations
    const startOfYear2027 = new Date('2027-01-04T00:00:00'); // Week 1 start (Monday)

    function getWeekNumber(dateStr) {
      if (!dateStr) return 1;
      const d = new Date(dateStr + 'T00:00:00');
      const diffDays = Math.floor((d - startOfYear2027) / (1000 * 60 * 60 * 24));
      return Math.max(1, Math.min(52, Math.floor(diffDays / 7) + 1));
    }

    function getWeekStartDate(weekNum) {
      const d = new Date(startOfYear2027);
      d.setDate(d.getDate() + (weekNum - 1) * 7);
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
    }

    // Event Listeners & Setup
    document.addEventListener('DOMContentLoaded', () => {
      setupViewpointToggles();
      renderSidebarControls();
      renderAll();
    });

    function setupViewpointToggles() {
      const btnAll = document.getElementById('btn-all');
      const btnDave = document.getElementById('btn-dave');
      const btnJamie = document.getElementById('btn-jamie');

      const setView = (filter, activeBtn) => {
        activeFilter = filter;
        [btnAll, btnDave, btnJamie].forEach(b => b.classList.remove('active'));
        activeBtn.classList.add('active');
        renderAll();
      };

      btnAll.addEventListener('click', () => setView('All', btnAll));
      btnDave.addEventListener('click', () => setView('Dave', btnDave));
      btnJamie.addEventListener('click', () => setView('Jamie', btnJamie));
    }

    function renderAll() {
      renderGantt();
      renderWorkloadCharts();
      renderMatrix();
    }

    // Sidebar Input Controls
    function renderSidebarControls() {
      const container = document.getElementById('sidebar-controls');
      container.innerHTML = '';

      cohorts.forEach((c, idx) => {
        const card = document.createElement('div');
        card.className = 'cohort-card';
        card.innerHTML = `
          <h4><span>${c.name} (${c.prog})</span></h4>
          <div class="form-row">
            <div class="form-group" style="flex:1;">
              <label>Start</label>
              <input type="date" value="${c.startDate}" onchange="updateCohort(${idx}, 'startDate', this.value)">
            </div>
            <div class="form-group" style="flex:1;">
              <label>End</label>
              <input type="date" value="${c.endDate}" onchange="updateCohort(${idx}, 'endDate', this.value)">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group" style="flex:1;">
              <label>Lead</label>
              <select onchange="updateCohort(${idx}, 'leader', this.value)">
                <option value="Dave" ${c.leader === 'Dave' ? 'selected' : ''}>Dave</option>
                <option value="Jamie" ${c.leader === 'Jamie' ? 'selected' : ''}>Jamie</option>
                <option value="Dave & Jamie" ${c.leader === 'Dave & Jamie' ? 'selected' : ''}>Dave & Jamie</option>
              </select>
            </div>
            <div class="form-group" style="flex:1;">
              <label>Lead Sess/Wk</label>
              <input type="number" min="0" max="10" value="${c.leadSess}" onchange="updateCohort(${idx}, 'leadSess', parseInt(this.value)||0)">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group" style="flex:1;">
              <label>Support</label>
              <select onchange="updateCohort(${idx}, 'support', this.value)">
                <option value="None" ${c.support === 'None' ? 'selected' : ''}>None</option>
                <option value="Dave" ${c.support === 'Dave' ? 'selected' : ''}>Dave</option>
                <option value="Jamie" ${c.support === 'Jamie' ? 'selected' : ''}>Jamie</option>
              </select>
            </div>
            <div class="form-group" style="flex:1;">
              <label>Supp Sess/Wk</label>
              <input type="number" min="0" max="10" value="${c.suppSess}" onchange="updateCohort(${idx}, 'suppSess', parseInt(this.value)||0)">
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    window.updateCohort = function(index, key, value) {
      cohorts[index][key] = value;
      renderAll();
    };

    // Render Visual 1: Gantt Timeline
    function renderGantt() {
      const header = document.getElementById('weeks-header');
      header.innerHTML = '<div style="text-align: left;">Cohort</div>';
      for (let w = 1; w <= 52; w++) {
        const div = document.createElement('div');
        div.textContent = `W${w}`;
        header.appendChild(div);
      }

      const rowsContainer = document.getElementById('gantt-rows');
      rowsContainer.innerHTML = '';

      const filtered = cohorts.filter(c => {
        if (activeFilter === 'All') return true;
        return c.leader.includes(activeFilter) || c.support === activeFilter;
      });

      filtered.forEach(c => {
        const startW = getWeekNumber(c.startDate);
        const endW = getWeekNumber(c.endDate);
        const duration = Math.max(1, endW - startW + 1);

        const row = document.createElement('div');
        row.className = 'programme-row';

        const label = document.createElement('div');
        label.className = 'row-label';
        label.textContent = c.id;

        const track = document.createElement('div');
        track.className = 'track-container';

        const grid = document.createElement('div');
        grid.className = 'week-grid-lines';
        for (let i = 0; i < 52; i++) grid.appendChild(document.createElement('div'));
        track.appendChild(grid);

        const leftPct = ((startW - 1) / 52) * 100;
        const widthPct = (duration / 52) * 100;

        const block = document.createElement('div');
        block.className = `block bg-${c.prog}`;
        block.style.left = `${leftPct}%`;
        block.style.width = `${widthPct}%`;
        block.textContent = c.id;

        track.appendChild(block);
        row.appendChild(label);
        row.appendChild(track);
        rowsContainer.appendChild(row);
      });
    }

    // Render Visual 2: Workload Charts
    function renderWorkloadCharts() {
      renderSingleWorkload('Dave', 'dave-chart');
      renderSingleWorkload('Jamie', 'jamie-chart');
    }

    function renderSingleWorkload(leaderName, containerId) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';

      for (let w = 1; w <= 52; w++) {
        let weeklySessions = 0;
        cohorts.forEach(c => {
          const startW = getWeekNumber(c.startDate);
          const endW = getWeekNumber(c.endDate);

          if (w >= startW && w <= endW) {
            if (c.leader.includes(leaderName)) {
              weeklySessions += c.leadSess;
            }
            if (c.support === leaderName) {
              weeklySessions += c.suppSess;
            }
          }
        });

        const loadClass = `load-${Math.min(weeklySessions, 5)}`;
        const col = document.createElement('div');
        col.className = 'bar-col';
        
        col.innerHTML = `
          <div class="tooltip">Wk ${w}: ${weeklySessions} sessions</div>
          <div class="bar ${loadClass}"></div>
        `;
        container.appendChild(col);
      }
    }

    // Render Visual 3: Continuous Vertical Matrix
    function renderMatrix() {
      const tbody = document.getElementById('matrix-body');
      tbody.innerHTML = '';

      for (let w = 1; w <= 52; w++) {
        const tr = document.createElement('tr');

        const tdWeek = document.createElement('td');
        tdWeek.className = 'week-label-cell';
        tdWeek.textContent = `Week ${w} (${getWeekStartDate(w)})`;
        tr.appendChild(tdWeek);

        ['GT', 'GE', 'GG'].forEach(prog => {
          const td = document.createElement('td');
          const activeInProg = cohorts.filter(c => {
            const startW = getWeekNumber(c.startDate);
            const endW = getWeekNumber(c.endDate);
            const isWeekActive = w >= startW && w <= endW;
            const isFiltered = activeFilter === 'All' || c.leader.includes(activeFilter) || c.support === activeFilter;
            return c.prog === prog && isWeekActive && isFiltered;
          });

          if (activeInProg.length === 0) {
            td.className = 'empty-cell';
            td.textContent = '—';
          } else {
            const laneContainer = document.createElement('div');
            laneContainer.className = 'lane-container';

            activeInProg.forEach(c => {
              const startW = getWeekNumber(c.startDate);
              const endW = getWeekNumber(c.endDate);
              const isStart = w === startW;
              const isEnd = w === endW;

              const lane = document.createElement('div');
              lane.className = 'lane';

              let radiusClass = '';
              if (isStart) radiusClass += ' v-start';
              if (isEnd) radiusClass += ' v-end';

              let leaderText = c.leader;
              if (c.support !== 'None') {
                leaderText += ` & ${c.support}`;
              }

              lane.innerHTML = `
                <div class="v-line v-line-${c.prog.toLowerCase()} ${radiusClass}">
                  ${isStart ? `<span>${c.name}</span>` : ''}
                  <span class="v-meta">${leaderText} (${c.leadSess + c.suppSess}s/wk)</span>
                </div>
              `;
              laneContainer.appendChild(lane);
            });
            td.appendChild(laneContainer);
          }
          tr.appendChild(td);
        });

        tbody.appendChild(tr);
      }
    }
  </script>
</body>
</html>
